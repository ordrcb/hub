/* what the team actually did in the last seven days, which the funnel cannot
   show because the funnel counts stages, not work */
function weekStats(){
  const since=new Date(TODAY); since.setDate(since.getDate()-7);
  const per={};
  const row=u=>per[u]||(per[u]={attempts:0, answered:0, conv:0, wa:0, emails:0, meetings:0, notes:0});
  // honest call metrics: an attempt is dialing, answered is any pickup, and a
  // conversation is 2+ minutes (the same rule as the 🔥 flag). A 3-second
  // "hello, no thanks" is answered, not a conversation.
  const isConv=det=>/\d+h\s/.test(det||"")||(+((det||"").match(/(\d+)m\s/)||[])[1]>=2);
  // emails split honestly: a mail WE sent is work (by_user is set on outbound),
  // a mail a lead sent back is a reply received, not our output
  let repliesIn=0;
  LEADS.forEach(l=>{
    l.logs.forEach(g=>{
      const d=day(String(g.at).slice(0,10)); if(!d||d<since) return;
      const u=(g.by_user||"team").split("@")[0];
      if(g.kind==="call"){ row(u).attempts++;
        if(!/not reached/i.test(g.detail||"")) row(u).answered++;
        if(isConv(g.detail)) row(u).conv++; }
      else if(g.kind==="wa") row(u).wa++;
      else if(g.kind==="email"){ if(g.by_user) row(u).emails++; else repliesIn++; }
      else if(g.kind==="meeting") row(u).meetings++;
    });
    l.notes.forEach(n=>{ const d=day(n.d); if(d&&d>=since) row(n.by||"team").notes++; });
  });
  const newLeads=LEADS.filter(l=>!l.internal && l.created && l.created>=since).length;
  const won=LEADS.filter(l=>l.client && l.client.first_paid_at && new Date(l.client.first_paid_at)>=since).length;
  const tickets=(window.__tickets||[]).filter(t=>new Date(t.opened_at)>=since).length;
  return {per, newLeads, won, tickets, since, repliesIn};
}

/* health of one data source: newest run wins, and a source that has not succeeded
   in a while is "stale" even when nothing crashed (a job that never starts is
   invisible otherwise) */
const STALE_HOURS = 4, DEAD_HOURS = 8;
function srcHealth(key){
  const runs=(window.__syncRuns||[]).filter(r=>r.source===key);
  const last=runs[0]||null;
  const ok=runs.find(r=>r.ok)||null;
  if(!last) return {state:"stale", last:null, msg:"No sync has ever run for this source."};
  const ageH=(Date.now()-new Date(ok?ok.ran_at:last.ran_at))/3600000;
  if(!last.ok) return {state:"bad", last, msg:(last.detail||"Failed")+(ok?" · last success "+new Date(ok.ran_at).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"")};
  if(ageH>DEAD_HOURS) return {state:"bad", last, msg:"No successful run for "+Math.round(ageH)+" hours. Something is wrong: check the sync, not just the schedule."};
  if(ageH>STALE_HOURS) return {state:"stale", last, msg:"Last fresh data "+Math.round(ageH)+" hours ago. Quiet periods are normal; press Sync now if you need it current."};
  return {state:"ok", last, msg:""};
}
function healthProblems(){

}

/* connecting a mailbox: the password is encrypted here, in the browser, with the
   public key from the database. What travels and what is stored is ciphertext;
   only the sync job holds the private key that can open it. */
async function encryptForServer(text){
  const b64 = STATS.mailboxKey;
  if(!b64) throw new Error("this hub has no mailbox key yet");
  const der = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  const key = await crypto.subtle.importKey("spki", der.buffer,
    {name:"RSA-OAEP", hash:"SHA-256"}, false, ["encrypt"]);
  const buf = await crypto.subtle.encrypt({name:"RSA-OAEP"}, key, new TextEncoder().encode(text));
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}

window.mbSave = async () => {
  const g=id=>((document.getElementById(id)||{}).value||"").trim();
  const email=g("mb-email").toLowerCase(), pass=(document.getElementById("mb-pass")||{}).value||"";
  if(!/^\S+@\S+\.\S+$/.test(email)){ toast("Enter your mailbox address"); return; }
  if(!pass){ toast("Enter the mail password"); return; }
  if(!g("mb-host")&&!ORG().imapHost){ toast("Enter the mail server (ask an admin if unsure)"); return; }
  let enc;
  try{ enc = await encryptForServer(pass); }
  catch(e){ hubAlert("Could not secure the password", esc(e.message)); return; }
  const row={ email, owner_email:ME, host:g("mb-host")||ORG().imapHost||"", port:parseInt(g("mb-port"),10)||993,
    pass_enc:enc, active:true, ok:null, error:null, updated_at:new Date().toISOString() };
  const {error}=await sb.from("mailboxes").upsert(row);
  if(error){ hubAlert("Could not save", esc(error.message)+(/duplicate|policy/i.test(error.message)?"<br><br>That address may already be connected by someone else.":"")); return; }
  const ov=document.getElementById("mergeov"); if(ov) ov.remove();
  window.__mailboxes=[...(window.__mailboxes||[]).filter(m=>m.owner_email!==ME), row];
  logAudit("mailbox",{detail:"connected "+email});
  render(false);
  const v=await hubDialog({title:"📬 Mailbox connected",
    body:"Your mail joins the hub on the next sync run. Start one now and it takes about two minutes.",
    okLabel:"⚡ Sync now", cancelLabel:"Wait for the next run"});
  if(v===true) syncNow();
};

  const num=(id,min,max,dflt)=>{ const v=parseInt((document.getElementById(id)||{}).value,10); return isNaN(v)?dflt:Math.min(max,Math.max(min,v)); };
  const cad={ resurface:num("cad-res",1,30,3), quiet:num("cad-quiet",2,90,14), callFrom:num("cad-from",0,23,9), callTo:num("cad-to",1,24,20), giveup:num("cad-giveup",2,20,5) };
  if(cad.quiet<=cad.resurface) cad.quiet=cad.resurface+1;
  if(cad.callTo<=cad.callFrom) cad.callTo=Math.min(24,cad.callFrom+1);
  window.__PREFS=Object.assign({},window.__PREFS,{cadence:cad});
  if(await savePrefs()){
    toast("Cadence saved: resurface "+cad.resurface+"d, quiet "+cad.quiet+"d, callable "+cad.callFrom+"-"+cad.callTo);
    logAudit("cadence",{detail:JSON.stringify(cad)});
  }
  render(false);
};

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ document.getElementById("login").style.display="flex"; return; }
  ME = session.user.email;
  // first arrival through an invite (or recovery) link: choose a password first
  if(/type=invite|type=recovery/.test(BOOTHASH) && !window.__pwSet){
    let pw="";
    while(pw.length<8){
      const v=await hubDialog({title:"Welcome 👋 Set your password",
        body:"You are signed in as "+esc(ME)+". Choose the password you will use from now on (at least 8 characters).",
        input:"password", okLabel:"Set my password", noCancel:true});
      pw=String(v||"").trim();
    }
    const {error:pe}=await sb.auth.updateUser({password:pw});
    if(pe) await hubAlert("Could not set the password", esc(pe.message)+"<br>You are still signed in; set it again in Settings → Account.");
    else { window.__pwSet=true; try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} toast("Password set ✓"); }
  }
  try {
    const {data:prof} = await sb.from("app_users").select("*").eq("email", ME).maybeSingle();
    window.PROFILE = prof || {role:"viewer", can_write:false, tabs:["today","fresh","followups","funnel","people"]};
  } catch(e){ window.PROFILE = {role:"viewer", can_write:false, tabs:["today","fresh","followups","funnel","people"]}; }
  window.CANW = PROFILE.role==="admin" || !!PROFILE.can_write;
  try {   // personal defaults: start tab, support filters, view (view only if this browser has none yet)
    const {data:up} = await sb.from("user_prefs").select("prefs").eq("email", ME).maybeSingle();
    const P = window.__PREFS = (up && up.prefs) || {};
    if(P.support) window.__SUP = Object.assign({lang:"all",days:"all",mine:false,un:false}, P.support);
    if(P.view && !localStorage.getItem("hub_view_v1")) Object.assign(VIEW, P.view);
    if(P.tab && PANELS[P.tab] && (PROFILE.role==="admin" || (PROFILE.tabs||[]).includes(P.tab))){ CURRENT = P.tab; window.__lastTab = P.tab; }
  } catch(e){}
  document.getElementById("login").style.display="none";
  document.getElementById("loading").style.display="flex";
  // a saved snapshot turns the next sign-in into a delta fetch (kilobytes)
  // instead of a full download (about a megabyte per person per login)
  const usedSnap = loadSnapshot();
  await loadData(usedSnap);
  await migrateLocal();
  document.getElementById("loading").style.display="none";
  document.getElementById("app").style.display="flex";
  render();
  startAutoReload();
}
/* ---------- snapshot between sign-ins: the big tables survive in this browser
   so a returning user costs a delta, not a fresh megabyte ---------- */
const SNAP_KEY="hub_snap_v1", SNAP_MAX_AGE=7*86400000;
function saveSnapshot(){
  try{
    localStorage.setItem(SNAP_KEY, JSON.stringify({at:Date.now(),
      people:RAW.people, touches:RAW.touches, coupons:RAW.coupons, tmsgs:RAW.tmsgs,
      jloc:RAW.jloc, jkids:RAW.jkids, jcom:RAW.jcom, mark:RAW.mark}));
  }catch(e){ try{ localStorage.removeItem(SNAP_KEY); }catch(_){} }   // quota: skip silently
}
function loadSnapshot(){
  try{
    const s=JSON.parse(localStorage.getItem(SNAP_KEY)||"null");
    if(!s || !s.at || Date.now()-s.at>SNAP_MAX_AGE || !Array.isArray(s.people) || !s.people.length) return false;
    RAW.people=s.people; RAW.touches=s.touches||[]; RAW.coupons=s.coupons||[]; RAW.tmsgs=s.tmsgs||[];
    RAW.jloc=s.jloc||[]; RAW.jkids=s.jkids||[]; RAW.jcom=s.jcom||[]; RAW.mark=s.mark||{};
    return !!(RAW.mark.people);
  }catch(e){ return false; }
}
/* the page keeps itself current: a quiet reload every few minutes, skipped while
   a dialog is open or something is being typed, so nothing is ever yanked away */
function startAutoReload(){
  if(window.__autoTimer) return;
  window.__autoTimer = setInterval(async ()=>{
    if(document.hidden) return;
    if(document.getElementById("mergeov") || document.getElementById("hubdlg")) return;
    const a=document.activeElement;
    if(a && ["INPUT","TEXTAREA","SELECT"].includes(a.tagName)) return;
    try{ await loadData(true); render(false); }catch(e){ console.error("auto reload failed:", e); }
  }, 600000);
}
boot();
