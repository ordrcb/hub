<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --border:rgba(11,11,11,.10); --accent:#2a78d6;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --goodtext:#006300;
  --f1:#86b6ef; --f2:#5598e7; --f3:#2a78d6; --f4:#1c5cab; --f5:#0d366b; --fgray:#c3c2b7;
  --chipbg:#f0efec; --mixpct:18%; --chipink:#52514e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --border:rgba(255,255,255,.10); --accent:#3987e5;
    --goodtext:#0ca30c; --f1:#9ec5f4; --f2:#6da7ec; --f3:#3987e5; --f4:#256abf; --f5:#184f95; --fgray:#52514e;
    --chipbg:#2c2c2a; --mixpct:30%; --chipink:#d6d5cd;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --border:rgba(255,255,255,.10); --accent:#3987e5;
  --goodtext:#0ca30c; --f1:#9ec5f4; --f2:#6da7ec; --f3:#3987e5; --f4:#256abf; --f5:#184f95; --fgray:#52514e;
  --chipbg:#2c2c2a; --mixpct:30%; --chipink:#d6d5cd;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--ink)}
a{color:var(--accent);text-decoration:none}
.layout{display:none;min-height:100vh}
nav{width:210px;flex:none;border-right:1px solid var(--border);padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{font-weight:700;font-size:16px;padding:6px 10px 14px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.navbtn{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;color:var(--ink2);
  padding:9px 10px;border-radius:8px;font:inherit;cursor:pointer;text-align:left}
.navbtn:hover{background:var(--chipbg)}
.navbtn.active{background:var(--chipbg);color:var(--ink);font-weight:600}
.navbtn .cnt{font-size:11px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:1px 7px;color:var(--ink2)}
.navfoot{margin-top:auto;padding:10px;font-size:11px;color:var(--muted)}
.navfoot a{cursor:pointer}
main{flex:1;padding:20px 24px;max-width:1060px}
header.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
header.top h1{font-size:18px;margin:0}
.search{flex:1;min-width:180px;max-width:340px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.stamp{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.tile .v{font-size:26px;font-weight:700}
.tile .l{font-size:12px;color:var(--ink2)}
.tile .s{font-size:11px;color:var(--muted)}
h2{font-size:15px;margin:22px 0 8px}
h2:first-child{margin-top:0}
#content h2.foldable{cursor:pointer;user-select:none}
#content h2.foldable::before{content:"▾ ";color:var(--muted)}
#content h2.foldable.folded::before{content:"▸ "}
#content h2.foldable:hover{color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;flex-wrap:wrap}
.row .who{flex:1;min-width:160px}
.row .who .nm{font-weight:600}
.row .who .co{color:var(--ink2);font-size:12px}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--chipbg);color:var(--chipink);white-space:nowrap}
.chip.coupon{background:color-mix(in srgb,var(--warn) var(--mixpct),var(--surface));color:var(--ink)}
.chip.call{background:color-mix(in srgb,var(--accent) var(--mixpct),var(--surface));color:var(--ink)}
.chip.stage{border:1px solid var(--border);background:var(--surface)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.ok .dot{background:var(--good)} .no .dot{background:var(--fgray)}
.tz{font-size:11px;color:var(--muted);white-space:nowrap}
.meta{font-size:11px;color:var(--muted);white-space:nowrap}
.detail .meta{white-space:normal;overflow-wrap:anywhere}
.detail{overflow:hidden}
.meta.due{color:var(--crit);font-weight:600}
.meta.quiet{color:var(--serious);font-weight:600}
.badge-t{font-size:11px;border:1px solid var(--border);border-radius:99px;padding:1px 7px;color:var(--ink2)}
.detail{display:none;border-top:1px solid var(--grid);padding:12px;gap:10px}
.card.open .detail{display:flex;flex-wrap:wrap}
.detail .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:6px 11px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{background:var(--chipbg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
select.st,textarea.note,input.li{font:inherit;font-size:13px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);padding:6px 8px}
textarea.note{width:100%;min-height:34px;resize:vertical}
/* the timeline reads as one vertical thread: a rail with a dot per event */
.notelog{display:flex;flex-direction:column;gap:0;max-height:180px;overflow-y:auto;padding-left:4px}
.noteitem{font-size:12.5px;position:relative;border-left:2px solid var(--grid);padding:3px 8px 7px 16px;color:var(--ink2)}
.noteitem::before{content:"";position:absolute;left:-5px;top:9px;width:6px;height:6px;border-radius:50%;
  background:var(--surface);border:2px solid var(--muted)}
.noteitem:hover::before{border-color:var(--accent)}
.noteitem.tout{border-left-color:var(--grid)}
.noteitem.tout::before{border-color:var(--accent);background:var(--accent)}
.noteitem:last-child{border-left-color:transparent}
#mergeov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;width:420px;max-width:min(96vw,620px);max-height:90vh;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px}
.mcard .meta{white-space:normal;overflow-wrap:anywhere}
/* the create button: quiet, round, monochrome; it should feel premium, not loud */
#plusbtn{width:34px;height:34px;border-radius:50%;padding:0;font-size:19px;line-height:1;font-weight:500;
  background:var(--ink);color:var(--page);border:1px solid var(--ink);flex:none;margin-left:auto}
#plusbtn:hover{opacity:.82;background:var(--ink)}
/* contact details first: the two things you grab when the phone rings */
.pcontacts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.pcontacts .chip{font-size:12.5px;padding:5px 12px;border:1px solid var(--border);background:var(--surface);color:var(--ink)}
.pcontacts .chip:hover{background:var(--chipbg)}
.mcard .li{width:100%;min-width:0}
.mcard .acts{gap:8px;flex-wrap:wrap;align-items:center}
.mcard .acts .li{width:auto;flex:1 1 120px}
.mcard .acts .st{flex:0 1 auto;max-width:100%}
.mcard label.chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.mcard h3{margin:0;font-size:14px}
.mhit{padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid var(--grid);margin-top:4px;font-size:13px}
.mhit:hover{background:var(--chipbg)}
.noteitem .meta{margin-right:6px}
.detail .left{flex:1;min-width:230px}
.detail .savenote{font-size:11px;color:var(--goodtext);visibility:hidden}
.bars{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.bar{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.bar .lb{font-size:12px;color:var(--ink2);text-align:right}
.bar .tr{background:none;height:22px;position:relative}
.bar .fl{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.bar .vl{position:absolute;left:calc(var(--w) + 8px);top:0;line-height:22px;font-size:12px;color:var(--ink2)}
.note-banner{border:1px solid var(--border);border-left:3px solid var(--warn);background:var(--surface);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink2);margin-bottom:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fbtn{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:99px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
.fbtn.active{background:var(--ink);color:var(--page);border-color:var(--ink)}
details.tbl{margin-top:10px}
details.tbl summary{font-size:12px;color:var(--muted);cursor:pointer}
table{border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}
td,th{border-bottom:1px solid var(--grid);padding:5px 12px 5px 0;text-align:left;font-size:12px}
th{color:var(--muted);font-weight:500}
.empty{border:1px dashed var(--grid);border-radius:10px;padding:26px;text-align:center;color:var(--muted);font-size:13px}
.empty b{color:var(--ink2)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--page);
  padding:8px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
#toast.show{opacity:1}
.tile.click{cursor:pointer}
.tile.click:hover{border-color:var(--accent)}
.sflink{font-size:11px;white-space:nowrap}
.tdel{border:0;background:none;cursor:pointer;font-size:11px;opacity:.45;padding:0 3px}
.tdel:hover{opacity:1}
.qwrap{position:relative;flex:1;min-width:180px;max-width:340px}
.qwrap .search{width:100%;max-width:none;padding-right:30px}
#qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px}
#qclear:hover{color:var(--ink)}
#qdrop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:60;max-height:60vh;overflow-y:auto}
.qhit{display:flex;gap:8px;align-items:center;padding:8px 12px;cursor:pointer;font-size:13px}
.qhit:hover{background:var(--chipbg)}
.qhit .tag{font-size:10px;border:1px solid var(--border);border-radius:99px;padding:1px 7px;color:var(--muted);white-space:nowrap;flex:none}
.errbar{border:1px solid var(--crit);border-left:4px solid var(--crit);background:var(--surface);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:12px}
.errbar code{font-size:11px;color:var(--muted);display:block;margin-top:4px;overflow-wrap:anywhere;max-height:120px;overflow-y:auto}
.phead{width:100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-bottom:8px;border-bottom:1px dashed var(--grid)}
.phead .chip.jump{cursor:pointer}
.phead .chip.jump:hover{border-color:var(--accent);color:var(--accent)}
.chip.life-client{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--ink)}
.chip.life-lead{background:color-mix(in srgb,var(--accent) 13%,var(--surface));color:var(--ink)}
.chip.asg{background:color-mix(in srgb,var(--accent) 15%,var(--surface));color:var(--ink)}
details.snip{display:inline}
details.snip summary{cursor:pointer;list-style:none;display:inline}
details.snip summary::-webkit-details-marker{display:none}
details.snip summary:hover{color:var(--accent)}
details.snip .body{margin:4px 0;padding:6px 8px;background:var(--chipbg);border-radius:6px;font-size:12px;white-space:pre-wrap;color:var(--ink2)}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center}
.logincard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;width:320px;display:flex;flex-direction:column;gap:10px}
.logincard h1{font-size:17px;margin:0 0 4px}
.logincard .err{color:var(--crit);font-size:12px;min-height:16px}
#loading{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
@media (max-width:760px){
  .layout{flex-direction:column} nav{width:auto;height:auto;position:static;display:flex;flex-direction:row;overflow-x:auto;padding:8px}
  .brand,.navfoot{display:none} .navbtn{white-space:nowrap} main{padding:14px}
}
</style>
</head>
<body>
<div id="login">
  <form class="logincard" onsubmit="doLogin(event)">
    <h1>Hub</h1>
    <input class="li" type="email" id="lemail" placeholder="Email" autocomplete="username" required>
    <input class="li" type="password" id="lpass" placeholder="Password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Sign in</button>
    <div class="err" id="lerr"></div>
  </form>
</div>
<div id="loading">Loading data…</div>
<div class="layout" id="app">
<nav id="nav"></nav>
<main>
  <header class="top">
    <h1 id="title">Today</h1>
    <div class="qwrap"><input class="search" id="q" name="hub-search" placeholder="Search everywhere: name, company, email, phone…" autocomplete="off" spellcheck="false" aria-autocomplete="none">
      <button id="qclear" style="display:none" title="Clear search" onclick="qClear()">✕</button>
      <div id="qdrop" style="display:none"></div></div>
    <span id="hctl" style="display:flex;gap:6px;align-items:center"></span>
    <button class="btn" id="plusbtn" onclick="plusMenu()" title="Create something new: lead, coupon, ticket, note" style="display:none">＋</button>
  </header>
  <div id="content"></div>
</main>
</div>
<script>

/* an invitation or recovery link lands with a token in the URL hash; remember
   what kind it was before the auth client consumes it */
const BOOTHASH = location.hash || "";
let ME = null;
let LEADS = [], byId = {}, STATS = {};

/* company-specific strings (addresses, system URLs) are loaded from the database
   after login, never written into this file: the page is hosted publicly and
   hardcoded addresses would be free food for scrapers */
const ORG = () => (STATS && STATS.orgConfig) || {};
/* colleagues are never leads: the company domain comes from the database too */
const isInternal = mail => {
  const d = (ORG().mailDomain || "").toLowerCase();
  const m = String(mail || "").toLowerCase();
  return !!d && m.endsWith("@" + d);
};
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const day = s => { if(!s) return null; const d=new Date(String(s).slice(0,10)+"T00:00:00"); return isNaN(d)?null:d; };
const daysAgo = d => Math.round((TODAY - d)/86400000);
const esc = s => (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const digits = s => (s||"").replace(/\D/g,"");
/* search matches phones in ANY written form: +1-23, 00123, (123), spaces, dots */
function phoneHit(q, ...phones){
  const qd = digits(q);
  if(qd.length<4 || /[a-z]/.test(q)) return false;
  const qq = qd.replace(/^0+/,"");
  return !!qq && phones.some(p=>digits(p).includes(qq));
}
const matchLead = (l,q) => phoneHit(q, l.phone, l.altPhone) ||
  [l.name,l.co,l.email,l.phone,l.alt].some(v=>(v||"").toLowerCase().includes(q));

/* ---------- stage mapping ---------- */
const STAGE = {"Neu":"New","Open - Not Contacted":"New","contacted":"Contacted","call_na":"Contacted",

const ACTIVE = s => !["Won","Lost","Junk"].includes(s);

   database so DST changes are always handled automatically */

"60":["MY","Asia/Kuala_Lumpur"],"61":["AU","Australia/Sydney"],"62":["ID","Asia/Jakarta"],
"63":["PH","Asia/Manila"],"64":["NZ","Pacific/Auckland"],"65":["SG","Asia/Singapore"],
"66":["TH","Asia/Bangkok"],"81":["JP","Asia/Tokyo"],"82":["KR","Asia/Seoul"],

const CA_AREAS = new Set(["204","226","236","249","250","263","289","306","343","354","365","367","368",

function tzInfo(phone){
  if(!phone) return null;
  let p = phone.replace(/[^\d+]/g,"");
  if(p.startsWith("00")) p = p.slice(2); else if(p.startsWith("+")) p = p.slice(1); else return null;
  for(const len of [3,2,1]){ const c=p.slice(0,len);
    if(TZ[c]){
      if(c==="1") return CA_AREAS.has(p.slice(1,4)) ? ["CA","America/Toronto"] : ["US","America/New_York"];
      return TZ[c];
    }
  }
  return null;
}
const CC_NAME = {US:"USA",CA:"Canada",UK:"United Kingdom",IE:"Ireland",DE:"Germany",AT:"Austria",
CH:"Switzerland",NO:"Norway",SE:"Sweden",DK:"Denmark",FI:"Finland",FR:"France",ES:"Spain",PT:"Portugal",

KW:"Kuwait",SA:"Saudi Arabia",OM:"Oman",IN:"India",PK:"Pakistan",JP:"Japan",KR:"Korea",CN:"China",
MY:"Malaysia",ID:"Indonesia",PH:"Philippines",TH:"Thailand","?":"Unknown"};
const flag = cc => cc==="?" ? "❓" : String.fromCodePoint(...[...(cc==="UK"?"GB":cc.slice(0,2))].map(c=>127397+c.charCodeAt(0)));
const TLD_CC = {de:"DE",at:"AT",ch:"CH",uk:"UK",ie:"IE",fr:"FR",it:"IT",es:"ES",pt:"PT",nl:"NL",
  pl:"PL",se:"SE",no:"NO",dk:"DK",fi:"FI",cy:"CY",gr:"GR",tr:"TR",lt:"LT",mt:"MT",sg:"SG",
  bh:"BH",qa:"QA",ae:"AE",au:"AU",nz:"NZ",ca:"CA",us:"US"};
function localHour(zone){
  try { return +new Intl.DateTimeFormat("en-GB",{timeZone:zone,hour:"2-digit",hour12:false}).format(new Date()); }
  catch(e){ return null; }
}
function callable(l){ const t=tzInfo(l.phone); if(!t) return null;
  const h=localHour(t[1]); if(h===null) return null;
  return {cc:t[0], h, ok: h>=CAD().callFrom && h<CAD().callTo}; }
const clockIn = zone => { try { return new Intl.DateTimeFormat("en-GB",{timeZone:zone,hour:"2-digit",minute:"2-digit"}).format(new Date()); } catch(e){ return "?"; } };

/* ---------- territory view (per-user preference, kept locally) ---------- */
const MY_TERR   = ["US","CA","UK","IE","AU","NZ","NO","SE","DK","FI"];
const EU_NODACH = ["UK","IE","FR","IT","ES","PT","NL","PL","SE","NO","DK","FI","LT","MT","CY","GR","TR"];
let VIEW = {preset:"my", extra:null, callable:false, range:"all", showCC:false};
try{ VIEW = Object.assign(VIEW, JSON.parse(localStorage.getItem("hub_view_v1")||"{}")); }catch(e){}
if(VIEW.extra) VIEW.extra = VIEW.extra.flatMap(c=>c==="US/CA"?["US","CA"]:[c]);
const saveView = () => localStorage.setItem("hub_view_v1", JSON.stringify(VIEW));
function activeCountries(){
  if(VIEW.extra) return new Set(VIEW.extra);
  return new Set([...MY_TERR,"?"]);   // starting default until the user picks; selection persists
}
function rangeBounds(){
  if(VIEW.range==="all"||!VIEW.range) return null;
  if(typeof VIEW.range==="number") return {from:new Date(TODAY - VIEW.range*86400000), to:null};
  if(VIEW.range.f||VIEW.range.t) return {from:VIEW.range.f?day(VIEW.range.f):null, to:VIEW.range.t?day(VIEW.range.t):null};
  return null;
}
function applyView(arr){
  const set = activeCountries();
  let out = set ? arr.filter(l=>set.has(l.cc)) : arr;
  if(VIEW.callable) out = out.filter(l=>{const c=callable(l); return c&&c.ok;});
  const rb = rangeBounds();
  if(rb) out = out.filter(l=>l.created && (!rb.from || l.created>=rb.from) && (!rb.to || l.created<=rb.to));
  return out;
}
window.applyRange = () => {
  const f=(document.getElementById("dfrom")||{}).value, t=(document.getElementById("dto")||{}).value;
  if(!f && !t){ VIEW.range="all"; } else { VIEW.range={f:f||"", t:t||""}; }
  saveView(); render(false);
};
window.ccSelectAll = () => { VIEW.extra = [...new Set(LEADS.filter(l=>!l.internal).map(l=>l.cc))]; saveView(); render(false); };
window.ccSelectNone = () => { VIEW.extra = []; saveView(); render(false); };
window.toggleCallable = () => { VIEW.callable=!VIEW.callable; saveView(); render(false); };
window.setRange = v => { VIEW.range = v==="all"?"all":+v; saveView(); render(false); };
window.toggleCCPanel = () => { VIEW.showCC=!VIEW.showCC; saveView(); render(false); };
window.toggleCC = cc => {
  let set = activeCountries();
  if(!set){ set = new Set(LEADS.filter(l=>!l.internal).map(l=>l.cc)); }
  set.has(cc) ? set.delete(cc) : set.add(cc);
  VIEW.extra = [...set]; saveView(); render(false);
};
function viewbar(){
  const counts={}; LEADS.filter(l=>!l.internal).forEach(l=>counts[l.cc]=(counts[l.cc]||0)+1);
  const set=activeCountries();
  const all=Object.keys(counts).length;
  const shown=Object.keys(counts).filter(c=>set.has(c)).length;
  const rb=(v,lb)=>`<button class="fbtn ${String(VIEW.range)===String(v)?'active':''}" onclick="setRange('${v}')">${lb}</button>`;
  const chips = !VIEW.showCC ? "" : `<div class="filters">
    <button class="fbtn" onclick="ccSelectAll()">✓ Select all</button>
    <button class="fbtn" onclick="ccSelectNone()">✗ None</button>`+
    Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([cc,n])=>
    `<button class="fbtn ${set.has(cc)?'active':''}" onclick="toggleCC('${cc}')" title="Click to show/hide this country">${flag(cc)} ${esc(CC_NAME[cc]||cc)} · ${n}</button>`).join("")+`</div>`;
  return `<div class="filters" style="margin-bottom:4px">
      <button class="fbtn ${VIEW.showCC?'active':''}" onclick="toggleCCPanel()">🌍 Countries ${shown}/${all} ${VIEW.showCC?"▴":"▾"}</button>
      <button class="fbtn ${VIEW.callable?'active':''}" onclick="toggleCallable()">☎ Callable now</button>
      <span style="flex:1"></span>
      ${rb("all","All 2026")}${rb(90,"90d")}${rb(30,"30d")}${rb(7,"7d")}
      <input type="date" class="li" id="dfrom" style="padding:4px 8px;font-size:12px" value="${(VIEW.range&&VIEW.range.f)||""}" title="From date">
      <input type="date" class="li" id="dto" style="padding:4px 8px;font-size:12px" value="${(VIEW.range&&VIEW.range.t)||""}" title="To date">
      <button class="fbtn ${VIEW.range&&(VIEW.range.f||VIEW.range.t)?'active':''}" onclick="applyRange()">→ Apply</button></div>
    ${chips}`;
}

/* ---------- data loading ---------- */
function derive(l){
  const laD = l.la ? day(l.la) : null;
  const logDays = l.logs.map(x=>({d:day(String(x.at).slice(0,10)), k:x.kind, det:x.detail||""})).filter(x=>x.d);
  const past = logDays.filter(x=>x.d<=TODAY).map(x=>x.d);
  const futureMeet = logDays.filter(x=>x.d>TODAY && x.k==="meeting" && !/CANCELED/.test(x.det))
    .map(x=>x.d).sort((a,b)=>a-b)[0] || null;
  const dueD = l.due ? day(l.due) : null;          // per-lead reminder (people.next_due)
  l.planned = [laD && laD>TODAY ? laD : null, futureMeet, dueD && dueD>TODAY ? dueD : null]
    .filter(Boolean).sort((a,b)=>a-b)[0] || null;
  l.lastPast = [laD && laD<=TODAY ? laD : null, ...past].filter(Boolean).sort((a,b)=>b-a)[0] || null;
  /* honest temperature: a "real conversation" is a meeting that happened or a
     2+ minute call. 🔥 only while one happened in the last 30 days; 💎 marks
     "was warm": 2+ real conversations ever, but none in the last 30 days. */
  const isConvDet = det => /\d+h\s/.test(det||"") || (+(((det||"").match(/(\d+)m\s/)||[])[1])>=2);
  const convDays = l.logs.filter(g=>
      (g.kind==="meeting" && !/CANCELED/.test(g.detail||"")) ||
      (g.kind==="call" && isConvDet(g.detail)))
    .map(g=>day(String(g.at).slice(0,10))).filter(d=>d && d<=TODAY);
  l.convs = convDays.length;
  l.lastConv = convDays.sort((a,b)=>b-a)[0] || null;
  l.hot = !!(l.lastConv && daysAgo(l.lastConv)<=30);
  l.warm = !l.hot && l.convs>=2;
  l.stage = l.hub ? HUB2STAGE[l.hub] : (STAGE[l.sf]||"New");
  if(l.client) l.stage = "Won";              // paying client = converted, leaves all chase lists
  l.touches = (l.sfTouches||0) + l.logs.length;
  l.isNew = l.stage==="New";
  l.attempted = l.isNew && l.touches>0;
  l.quiet = l.lastPast ? daysAgo(l.lastPast) : (l.created ? daysAgo(l.created) : 0);
}
/* Supabase caps every response at 1000 rows; growing tables MUST be paged or
   the newest rows silently vanish (that was the "my logged call disappeared on
   refresh" bug: touches crossed 1000). */
async function fetchAll(table, sel, orderCol){
  let out=[], from=0; const CH=1000;
  for(;;){
    const {data, error} = await sb.from(table).select(sel).order(orderCol,{ascending:true}).range(from, from+CH-1);
    if(error) return {data:out, error};
    out=out.concat(data||[]);
    if(!data || data.length<CH) return {data:out, error:null};
    from+=CH;
  }
}
/* Big tables are downloaded once per session and then only what changed is
   fetched. A background refresh costs a few kilobytes instead of the whole
   dataset, which keeps a whole team inside the free bandwidth allowance.
   Merging is additive: rows are updated in place, never dropped, so nothing can
   vanish from a timeline. Deletions and merges are caught by the row counts. */
const RAW = { people:[], touches:[], coupons:[], tmsgs:[], jloc:[], jkids:[], jcom:[], mark:{} };
/* Jira mirror columns the dashboard actually shows (passwords never exist in the mirror) */
const JLOC_SEL = "key,summary,phase,client_number,company,contact_name,contact_email,phone,country,language,"+
  "contract_model,contract_status,contract_start,contract_renewal,contract_termination,test_start,test_end,"+
  "deposit,payment_rhythm,payment_problems,mrr,vat,price_start,price_now,price_3m,price_6m,price_12m,"+
  "cubes,cubes_version,tablets,ipads,watches,manager_name,manager_email,sys_link,next_call,"+
  "person_id,client_id,match_via,manual_payer,jira_updated,updated_at";
const JKID_SEL = "key,parent_key,client_number,project,issue_type,ticket_type,status,summary,tracking_link,"+
  "tracking_number,delivery_service,date_shipment,date_receipt,scheduled_delivery,questionnaire_sent,"+
  "questionnaire_filled,jira_created,jira_resolved,jira_updated,updated_at,"+
  "company,contact_name,contact_email,phone,person_id";
const upsertRows = (arr, rows, key) => {
  if(!rows || !rows.length) return arr;
  const ix = new Map(arr.map((r,i)=>[r[key],i]));
  rows.forEach(r=>{ const i=ix.get(r[key]); if(i===undefined){ ix.set(r[key],arr.length); arr.push(r); } else arr[i]=r; });
  return arr;
};
const maxOf = (rows, col) => rows.reduce((m,r)=> (r[col]>m ? r[col] : m), "");
const rowCount = async t => { try{ const {count}=await sb.from(t).select("*",{count:"exact",head:true}); return count; }catch(e){ return null; } };

async function loadData(delta){
  const canDelta = delta && RAW.people.length && RAW.mark.people;
  // small tables are cheap enough to take whole every time
  const small = await Promise.all([
    sb.from("stats").select("key,value"),
    sb.from("sync_runs").select("source,ran_at,ok,detail").order("ran_at",{ascending:false}).limit(40),
    canDelta ? sb.from("tickets").select("*").gt("updated_at", RAW.mark.tickets||"").limit(400)
             : sb.from("tickets").select("*").order("last_activity_at",{ascending:false}).limit(400),
    sb.from("app_users").select("*").order("email"),
    sb.from("unmatched_inbox").select("*").order("last_at",{ascending:false}).limit(500),
    sb.from("unmatched_calls").select("*").order("cnt",{ascending:false}).limit(500),
    sb.from("coupon_requests").select("*").order("id",{ascending:false}).limit(50),
    sb.from("mailboxes").select("email,owner_email,host,port,active,ok,error,last_sync").order("email"),
    sb.from("audit").select("*").order("at",{ascending:false}).limit(400),
    // Jira mirror: locations always (slim, ~360 rows), children only the OPEN
    // ones (closed history loads lazily per person), comments newest first
    canDelta ? sb.from("jira_locations").select(JLOC_SEL).gt("updated_at", RAW.mark.jloc||"").limit(500)
             : sb.from("jira_locations").select(JLOC_SEL).order("key").limit(1000),
    canDelta ? sb.from("jira_children").select(JKID_SEL).gt("updated_at", RAW.mark.jkids||"").limit(1000)
             : sb.from("jira_children").select(JKID_SEL).is("jira_resolved",null)
                 .not("status","in",'("DELIVERED","CANCELED","LOST / RETURNED","RK_CLOSED","Done")').limit(2000),
    // orphan children matched straight to a person load even when closed:
    // a delivered shipment is exactly what the card should show for a new client
    sb.from("jira_children").select(JKID_SEL).is("parent_key",null).not("person_id","is",null).limit(500),
    sb.from("payment_problems").select("*").order("invoice_created",{ascending:false}).limit(500),
    canDelta ? sb.from("jira_comments").select("*").gt("id", RAW.mark.jcom||0).order("id").limit(300)
             : sb.from("jira_comments").select("*").order("id",{ascending:false}).limit(300),
    sb.from("ops_hidden").select("*"),
    sb.from("reminders").select("*").is("done_at",null).order("due").limit(300),
  ]);
  const [{data:statRows, error:e3},{data:runRows},{data:ticketRows},{data:userRows},
         {data:umailRows},{data:ucallRows},{data:creqRows},{data:mbRows},{data:auditRows},
         {data:jlocRows},{data:jkidRows},{data:jorphRows},{data:ppRows},{data:jcomRows},{data:ohRows},{data:remRows}] = small;
  window.__rems = remRows||window.__rems||[];

  let e1=null, e2=null, e4=null;
  if(!canDelta){
    const [p, t, cp, tm] = await Promise.all([
      fetchAll("people","*","created_at"),
      fetchAll("touches","id,person_id,kind,at,detail,by_user,snippet","id"),
      fetchAll("coupons","code,person_id,issued_at,expires_at,redeemed,raw,updated_at","id"),
      fetchAll("ticket_messages","*","id"),
    ]);
    e1=p.error; e2=t.error; e4=cp.error;
    RAW.people=p.data||[]; RAW.touches=t.data||[]; RAW.coupons=cp.data||[]; RAW.tmsgs=tm.data||[];
  } else {
    const m = RAW.mark;
    const [p, t, cp, tm] = await Promise.all([
      sb.from("people").select("*").gt("updated_at", m.people).limit(1000),
      sb.from("touches").select("id,person_id,kind,at,detail,by_user,snippet").gt("id", m.touchId).order("id").limit(1000),
      sb.from("coupons").select("code,person_id,issued_at,expires_at,redeemed,raw,updated_at").gt("updated_at", m.coupons||"").limit(1000),
      sb.from("ticket_messages").select("*").gt("id", m.tmsgId).order("id").limit(1000),
    ]);
    e1=p.error; e2=t.error; e4=cp.error;
    upsertRows(RAW.people, p.data, "id");
    upsertRows(RAW.touches, t.data, "id");
    upsertRows(RAW.coupons, cp.data, "code");
    upsertRows(RAW.tmsgs, tm.data, "id");
    // rows that disappeared (deletes, merges) never show up in a delta: compare
    // counts and fall back to a full load for that table when they drift
    const [cP, cT] = await Promise.all([rowCount("people"), rowCount("touches")]);
    if(cP!==null && cP!==RAW.people.length){ const r=await fetchAll("people","*","created_at"); if(!r.error) RAW.people=r.data; }
    if(cT!==null && cT!==RAW.touches.length){ const r=await fetchAll("touches","id,person_id,kind,at,detail,by_user,snippet","id"); if(!r.error) RAW.touches=r.data; }
  }
  if(e1||e2||e3||e4){ hubAlert("Load error", esc((e1||e2||e3||e4).message)); return; }
  RAW.mark.people  = maxOf(RAW.people,"updated_at") || new Date().toISOString();
  RAW.mark.coupons = maxOf(RAW.coupons,"updated_at") || RAW.mark.coupons || "";
  RAW.mark.touchId = RAW.touches.reduce((m,r)=>Math.max(m, r.id||0), 0);
  RAW.mark.tmsgId  = RAW.tmsgs.reduce((m,r)=>Math.max(m, r.id||0), 0);

  const people = RAW.people, touchRows = RAW.touches, couponRows = RAW.coupons, tmsgRows = RAW.tmsgs;
  window.__couponRows = couponRows||[];
  window.__syncRuns = runRows||[];
  // tickets: full list on the first load, then only the ones that changed
  if(canDelta){
    upsertRows(window.__tickets=window.__tickets||[], ticketRows, "id");
    const cTk = await rowCount("tickets");
    if(cTk!==null && cTk!==window.__tickets.length){
      const {data:all} = await sb.from("tickets").select("*").order("last_activity_at",{ascending:false}).limit(400);
      window.__tickets = all||window.__tickets;
    }
  } else window.__tickets = ticketRows||[];
  RAW.mark.tickets = maxOf(window.__tickets,"updated_at") || RAW.mark.tickets || "";
  window.__users = userRows||[];
  window.__trayMail = umailRows||[];
  window.__trayCalls = ucallRows||[];
  window.__couponReqs = creqRows||[];
  // who issued which coupon (groundwork for a future referral-partner role)
  window.__couponBy = {};
  (creqRows||[]).forEach(r=>{ if(r.code&&r.requested_by) window.__couponBy[r.code]=String(r.requested_by).split("@")[0]; });
  window.__mailboxes = mbRows||[];
  // Jira mirror merge (additive, same rules as the big tables)
  if(canDelta){
    upsertRows(RAW.jloc, jlocRows, "key");
    upsertRows(RAW.jkids, jkidRows, "key");
    upsertRows(RAW.jcom, jcomRows, "id");
  } else {
    RAW.jloc = jlocRows||[]; RAW.jkids = jkidRows||[]; RAW.jcom = (jcomRows||[]).reverse();
  }
  upsertRows(RAW.jkids, jorphRows, "key");
  RAW.mark.jloc = maxOf(RAW.jloc,"updated_at") || RAW.mark.jloc || "";
  RAW.mark.jkids = maxOf(RAW.jkids,"updated_at") || RAW.mark.jkids || "";
  RAW.mark.jcom = RAW.jcom.reduce((m,r)=>Math.max(m, r.id||0), 0);
  window.__pprobs = ppRows||[];
  window.__opsHidden = new Map((ohRows||[]).map(r=>[r.id,r]));
  window.__locByPerson = {};
  window.__locByClient = {};
  RAW.jloc.forEach(j=>{
    if(j.person_id) (window.__locByPerson[j.person_id]=window.__locByPerson[j.person_id]||[]).push(j);
    if(j.client_id) (window.__locByClient[j.client_id]=window.__locByClient[j.client_id]||[]).push(j);
  });
  window.__kidsByParent = {};
  RAW.jkids.forEach(k=>{ if(k.parent_key) (window.__kidsByParent[k.parent_key]=window.__kidsByParent[k.parent_key]||[]).push(k); });
  window.__comByKey = {};
  RAW.jcom.forEach(cm=>{ (window.__comByKey[cm.issue_key]=window.__comByKey[cm.issue_key]||[]).push(cm); });
  window.__audit = auditRows||[];
  window.__auditBy = {};
  (auditRows||[]).forEach(a=>{ if(a.person_id) (window.__auditBy[a.person_id]=window.__auditBy[a.person_id]||[]).push(a); });
  // clients only change when Stripe reports different numbers, so compare what
  // the sync said rather than when it ran (it runs every half hour regardless)
  const stripeRun = (runRows||[]).find(r=>r.source==="stripe" && r.ok);
  const stripeMark = stripeRun ? stripeRun.detail : "none";
  if(!window.__clients || RAW.mark.stripe!==stripeMark){
    const {data:cl} = await sb.from("clients").select("*").order("total_paid",{ascending:false}).limit(500);
    window.__clients = cl||[];
    RAW.mark.stripe = stripeMark;
  }
  const clientRows = window.__clients||[];
  window.__tmsgs = {};
  (tmsgRows||[]).forEach(m=>{ (window.__tmsgs[m.ticket_id]=window.__tmsgs[m.ticket_id]||[]).push(m); });
  STATS = Object.fromEntries((statRows||[]).map(r=>[r.key,r.value]));
  const tByP = {};
  (touchRows||[]).forEach(t=>{ (tByP[t.person_id]=tByP[t.person_id]||[]).push(t); });
  // merged duplicates leave the working lists but still count in the funnel's intake
  window.__mergedRows = (people||[]).filter(p=>p.merged_into).map(p=>{
    const t = tzInfo(p.phone);
    const tld=(p.email||"").split(".").pop().toLowerCase();
    return { created: day(p.sf_created_at)||day(p.created_at), cc: t?t[0]:(TLD_CC[tld]||"?") };
  });
  // archived leads leave every list but stay restorable from the People tab
  window.__archived = (people||[]).filter(p=>p.archived_at && !p.merged_into);
  LEADS = (people||[]).filter(p=>!p.merged_into && !p.archived_at).map(p=>{
    const mine = (tByP[p.id]||[]).sort((a,b)=>a.at<b.at?-1:1);
    const t = tzInfo(p.phone);
    const tld = (p.email||"").split(".").pop().toLowerCase();
    const l = {
      id: p.id, sfId: p.sf_id, name: p.name, co: p.company||"", email: p.email||"", alt: p.alt_email||"", phone: p.phone||"",
      altPhone: p.alt_phone||"", due: p.next_due||null, assigned: p.assigned_to||null,
      sf: p.sf_status, src: p.source||"", hub: p.hub_status||null,
      created: day(p.sf_created_at), la: p.sf_last_activity, sfTouches: p.sf_touches||0,
      notes: mine.filter(x=>x.kind==="note").map(x=>({id:x.id, d:String(x.at).slice(0,10), x:x.detail, by:(x.by_user||"").split("@")[0]})),
      logs: mine.filter(x=>x.kind!=="note"),
      cc: t ? t[0] : (TLD_CC[tld]||"?"),
      coupon: !!p.is_coupon_requester,
      createdBy: p.created_by||null,
      internal: isInternal(p.email)
    };
    derive(l);
    return l;
  });
  byId = Object.fromEntries(LEADS.map(l=>[l.id,l]));
  const fmtVal = r => (r?.discount_type==="percentage") ? (r.value+"%") : ((r?.value||0)/100+"€");
  LEADS.forEach(l=>l.coupons=[]);
  (couponRows||[]).forEach(cp=>{
    const l = byId[cp.person_id]; if(!l) return;
    const exp = day(cp.expires_at);
    l.coupons.push({code:cp.code, val:fmtVal(cp.raw), exp, redeemed:cp.redeemed,
      issued: cp.issued_at || null,
      offer: (cp.raw && cp.raw.offer_url) || null,
      active: !cp.redeemed && exp && exp>=TODAY});
  });
  LEADS.forEach(l=>{ l.cp = l.coupons.filter(x=>x.active).sort((a,b)=>a.exp-b.exp)[0] || null; });
  const cByEmail = {}; (clientRows||[]).forEach(cl=>{ if(cl.email) cByEmail[cl.email]=cl; });
  LEADS.forEach(l=>{ l.client=null; });
  (clientRows||[]).forEach(cl=>{ if(cl.person_id && byId[cl.person_id]) byId[cl.person_id].client=cl; });
  LEADS.forEach(l=>{
    if(!l.client && l.email && cByEmail[l.email.toLowerCase()]) l.client=cByEmail[l.email.toLowerCase()];
    if(!l.client && l.alt && cByEmail[l.alt.toLowerCase()]) l.client=cByEmail[l.alt.toLowerCase()];
  });
  LEADS.forEach(l=>{ if(l.client) derive(l); });   // clients become "Won" after linking
  // People completeness: humans the hub knows only from Stripe or support mail
  // get lightweight entries so the People tab really shows EVERYONE.
  const known=new Set();
  LEADS.forEach(l=>{ if(l.email) known.add(l.email.toLowerCase()); if(l.alt) known.add(l.alt.toLowerCase()); });
  const extras=[];
  (clientRows||[]).forEach(cl=>{
    const em=(cl.email||"").toLowerCase();
    if(cl.person_id && byId[cl.person_id]) return;
    if(em && known.has(em)) return;
    if(em) known.add(em);
    extras.push({pseudo:"client", name:cl.name||cl.email||cl.stripe_id, email:cl.email||"",
      sub:eur(cl.total_paid,cl.currency)+" · "+cl.payments+"× paid"});
  });
  (ticketRows||[]).forEach(t=>{
    const em=(t.customer_email||"").toLowerCase();
    if(!em || known.has(em)) return;
    known.add(em);
    const cnt=(ticketRows||[]).filter(x=>(x.customer_email||"").toLowerCase()===em).length;
    extras.push({pseudo:"ticket", name:t.customer_name||t.customer_email, email:t.customer_email,
      sub:cnt+" ticket"+(cnt>1?"s":"")});
  });
  window.__extraPeople=extras;
  try{ saveSnapshot(); }catch(e){}
}
const eur = (cents,cur) => (Math.round((cents||0)/100)).toLocaleString("de-DE") + " " + ((cur||"eur").toUpperCase());
const daysTo = d => Math.round((d - TODAY)/86400000);
const expTxt = cp => { const n = daysTo(cp.exp); return n===0 ? "expires TODAY" : "expires in "+n+"d"; };

/* ---------- one-time migration of pre-login local edits ---------- */
async function migrateLocal(){
  let old={};
  try{ old = JSON.parse(localStorage.getItem("hub_edits_v1")||"{}"); }catch(e){ return; }
  const bySf = Object.fromEntries(LEADS.map(l=>[l.sfId,l]));
  let acted=false;

function orphanKidsFor(l){
  const ems=[l.email,l.alt,l.client&&l.client.email].filter(Boolean).map(e=>e.toLowerCase());

    if(k.contact_email && ems.includes(String(k.contact_email).toLowerCase())) return true;

/* UPS locale: flip the loc= value in the link Jira gives us (de_DE for DACH,
   en_EN otherwise), never hand a German page to a US customer */
function upsLink(kid, loc){
  // the phone prefix decides: Jira's Language field is often left on DE even
  // for US customers (seen on real tickets), the number does not lie
  const ph=((loc&&loc.phone)||kid.phone||"").replace(/[\s-]/g,"");
  const dach=ph?/^(\+|00)(49|43|41)/.test(ph):(loc&&loc.language)==="DE";
  const want=dach?"de_DE":"en_EN";
  if(kid.tracking_link) return kid.tracking_link.replace(/([?&]loc=)[A-Za-z_]+/,"$1"+want);
  if(kid.tracking_number) return `https://www.ups.com/track?loc=${want}&tracknum=${encodeURIComponent(kid.tracking_number)}&requester=ST/trackdetails`;
  return null;
}

    return esc(who)+(j&&j.company?" · "+esc(j.company):"");
  };
  const dTo=d=>Math.round((new Date(d+"T00:00:00")-today)/86400000);
  const dFrom=d=>d?Math.max(0,Math.round((today-new Date(String(d).slice(0,10)+"T00:00:00"))/86400000)):0;
  for(const k of RAW.jkids){
    const j=locByKey[k.parent_key];
    const qk=dFrom(k.jira_updated)>30;   // untouched in Jira for a month: probably done, just never closed
    if(k.project==="RK"&&kidOpen(k)){
      out.push({id:"service:"+k.key, quiet:qk, kind:"service", icon:"🔧", our:k.status!=="RK_DELIVERY_WAITING", age:dFrom(k.jira_created),
        title:(k.summary||k.key)+" · "+(k.status||""), who:j?personLoc(j):esc(k.summary||k.key), key:k.key, loc:j, kid:k});
    }
    if(k.project==="SH"&&kidOpen(k)){
      out.push({id:"shipment:"+k.key, quiet:qk, kind:"shipment", icon:"📦", our:k.status==="DATA VALIDATION", age:dFrom(k.date_shipment||k.jira_created),
        title:(k.status||"open")+(k.date_shipment?" · shipped "+dstr(k.date_shipment):""), who:j?personLoc(j):esc(k.summary||k.key), key:k.key, loc:j, kid:k});
      if(k.questionnaire_sent&&!k.questionnaire_filled)
        out.push({id:"questionnaire:"+k.key, quiet:qk, kind:"questionnaire", icon:"📋", our:dFrom(k.questionnaire_sent)>7, age:dFrom(k.questionnaire_sent),
          title:"questionnaire sent "+dstr(k.questionnaire_sent)+", not filled", who:j?personLoc(j):esc(k.summary||k.key), key:k.key, loc:j, kid:k});
    }
  }
  for(const p of (window.__pprobs||[])){
    out.push({id:"payment:"+p.invoice_id, quiet:dFrom(p.invoice_created)>60, kind:"payment", icon:"💳", our:true, age:dFrom(p.invoice_created),
      title:Math.round((p.amount||0)/100)+"€ "+(p.status==="uncollectible"?"uncollectible":"unpaid")
        +(p.attempts?" · "+p.attempts+" attempt"+(p.attempts>1?"s":""):"")
        +(p.next_retry?" · retry "+new Date(p.next_retry).toLocaleDateString():"")
        +(p.reason?" · "+p.reason.slice(0,80):""),
      who:esc(p.name||p.email||"?"), email:p.email, pp:p});
  }
  const cliById={}; (window.__clients||[]).forEach(c=>cliById[c.id]=c);
  for(const j of RAW.jloc){
    if(j.test_end&&/TEST/i.test(j.phase||"")){
      const d=dTo(j.test_end);
      if(d<=60) out.push({id:"test:"+j.key, kind:"test", icon:"🧪", our:d<=14, age:Math.max(0,-d),
        title:"test period "+(d<0?"ended "+(-d)+"d ago":"ends in "+d+"d")+" ("+dstr(j.test_end)+")", who:personLoc(j), key:j.key, loc:j, due:d});
    }
    if(j.contract_renewal&&(j.phase||"")==="CS_CONTRACT"){
      const d=dTo(j.contract_renewal);
      if(d<=60&&d>=-30) out.push({id:"renewal:"+j.key, kind:"renewal", icon:"🔄", our:d<=30, age:Math.max(0,-d),
        title:"renewal "+(d<0?(-d)+"d overdue":"in "+d+"d")+" ("+dstr(j.contract_renewal)+")", who:personLoc(j), key:j.key, loc:j, due:d});
    }
    // consistency checks: the mirror lets us see what no single system shows.
    // Customers marked "pays outside Stripe" are exempt from the money checks.
    const cl=j.client_id?cliById[j.client_id]:null;
    if(!j.manual_payer){
      if(j.mrr&&cl&&cl.mrr!=null&&Math.abs(j.mrr-cl.mrr/100)>1)
        out.push({id:"check-mrr:"+j.key, kind:"check", icon:"⚖", our:true, age:0,
          title:"Jira says "+j.mrr+"€ MRR, Stripe collects "+Math.round(cl.mrr/100)+"€", who:personLoc(j), key:j.key, loc:j});
      // "no recent payment" must respect how often they are billed: a yearly payer
      // is perfectly healthy 10 months after the last invoice
      const rhythmDays=/year|jähr|annual/i.test(j.payment_rhythm||"")?400:/quart/i.test(j.payment_rhythm||"")?120:60;
      if((j.phase||"")==="CS_CONTRACT"&&cl&&cl.last_paid_at&&dFrom(cl.last_paid_at)>rhythmDays)
        out.push({id:"check-pay:"+j.key, kind:"check", icon:"⚖", our:true, age:dFrom(cl.last_paid_at),
          title:"active contract, last payment "+dFrom(cl.last_paid_at)+"d ago ("+esc(j.payment_rhythm||"monthly")+")", who:personLoc(j), key:j.key, loc:j});
      const hasPP=(window.__pprobs||[]).some(p=>p.email&&[j.contact_email,j.manager_email,cl&&cl.email].filter(Boolean).map(e=>e.toLowerCase()).includes(p.email));
      if(j.payment_problems===true&&!hasPP)
        out.push({id:"check-flagstale:"+j.key, kind:"check", icon:"⚖", our:false, age:0,
          title:"Jira payment-problems flag is set but Stripe shows nothing failing (flag may be stale)", who:personLoc(j), key:j.key, loc:j});
      if(j.payment_problems===false&&hasPP)
        out.push({id:"check-flagoff:"+j.key, kind:"check", icon:"⚖", our:true, age:0,
          title:"Stripe shows failing payments but the Jira flag is off", who:personLoc(j), key:j.key, loc:j});
    }
  }
  return out;
}

/* lifecycle: client (paid), lead (came in via sales), support-only (only ever wrote to support) */
function lifecycleOf(l){
  if(l.client) return "client";
  const leadish = l.sfId || l.coupon || /website|discount|book|calendly|checkout|email/i.test(l.src||"");
  if(!leadish && ticketsOf(l).length) return "support";
  return "lead";
}

/* one person, whole story: notes, calls, WA, emails, coupons, tickets, payments in one thread */
function timeline(l){
  const tks=ticketsOf(l);
  return [
    ...l.notes.map(n=>({d:n.d, i:"📝", t:(n.by?n.by+": ":"")+n.x, del:n.id})),
    ...l.logs.map(g=>({d:String(g.at).slice(0,10),
      i:g.kind==="meeting"?"📅":g.kind==="wa"?"💬":g.kind==="call"?"📞":"✉️",
      t:(g.kind==="meeting"?(g.detail||"Meeting")
        :g.kind==="email"?(g.detail||"Email")
        :g.kind==="call"?(g.detail||"Call")
        :(g.detail||"WhatsApp touch")).replace(/\s*\[(cal|pt):[^\]]+\]/g,"")   // internal sync tags stay out of sight
        +(g.by_user?" · "+String(g.by_user).split("@")[0]:""),
      snip:g.kind==="email"?(g.snippet||null):null,
      del:(g.id && (g.kind==="wa" || (g.kind==="call" && !imported(g))))?g.id:null})),
    ...l.coupons.map(cp=>({d:String(cp.issued||"").slice(0,10), i:"🎟",
      t:"Coupon "+cp.code+" ("+cp.val+")"+(cp.redeemed?" · redeemed 🎉":(cp.exp?(cp.active?" · expires "+cp.exp.toLocaleDateString():" · expired"):""))
        +((window.__couponBy||{})[cp.code]?" · by "+(window.__couponBy||{})[cp.code]:"")})),
    ...tks.map(t=>({d:String(t.opened_at).slice(0,10), i:"🎫",
      t:"Support: "+(t.subject||"")+" · "+String(t.state).replace(/_/g," ")})),
    ...(window.PROFILE&&PROFILE.role==="admin"?((window.__auditBy||{})[l.id]||[]):[]).map(a=>({d:String(a.at).slice(0,10), i:"✏️",
      t:(a.who?String(a.who).split("@")[0]+": ":"")+({status:"status",assign:"owner",merge:"merged",unmerge:"merge undone",reminder:"reminder"}[a.action]||a.action)
        +(a.detail?" · "+a.detail:""),
      undoId:(a.action==="merge"&&a.undo)?a.id:null})),
    ...(l.client?[{d:String(l.client.first_paid_at||"").slice(0,10), i:"🎉",
      t:"LEAD → CLIENT: first payment. "+l.client.payments+" payment"+(l.client.payments>1?"s":"")+" · "
        +eur(l.client.total_paid,l.client.currency)+" total so far. Below this line is the lead journey, above is life as a client."}]:[])
  ].filter(e=>e.d).sort((a,b)=>b.d.localeCompare(a.d));
}

/* generic person picker modal: search, click, callback */
function pickPerson(title, onPick, excludeId){
  let ov=document.getElementById("mergeov"); if(ov) ov.remove();
  ov=document.createElement("div"); ov.id="mergeov";
  ov.innerHTML=`<div class="mcard">
    <h3>${title}</h3>
    <input class="li" id="msearch" placeholder="Type name, email, phone or company…">
    <div id="mres"></div>
    <button class="btn" onclick="document.getElementById('mergeov').remove()">Cancel</button></div>`;
  ov.addEventListener("click",e=>{ if(e.target===ov) ov.remove(); });
  document.body.appendChild(ov);
  const res=ov.querySelector("#mres"), inp=ov.querySelector("#msearch");
  inp.addEventListener("input",()=>{
    const q=inp.value.toLowerCase().trim();
    if(q.length<2){ res.innerHTML=""; return; }
    const hits=LEADS.filter(x=>x.id!==excludeId && matchLead(x,q)).slice(0,8);
    res.innerHTML="";
    hits.forEach(x=>{
      const d=document.createElement("div"); d.className="mhit";
      d.innerHTML=`<b>${esc(x.name)}</b> · ${esc(x.email||x.phone||"no contact")} <span class="meta">${esc(x.hub||x.stage)}${x.client?" · 💰":""}</span>`;
      d.onclick=()=>onPick(x.id);
      res.appendChild(d);
    });
    if(!hits.length) res.innerHTML='<div class="meta" style="padding:8px">No match found</div>';
  });
  inp.focus();
}

window.doMerge = async (keepId, dupId) => {
  const keep=byId[keepId], dup=byId[dupId];
  if(!await hubConfirm("⇄ Merge "+esc(dup.name||"?")+" into "+esc(keep.name||"?")+"?",
    "One person, one card: all notes, touches, coupons and tickets move over, and BOTH emails and BOTH phone numbers are kept. The payment email becomes the primary one.","Merge")) return;
  const ov=document.getElementById("mergeov"); if(ov) ov.remove();
  // the person becomes ONE record with BOTH emails; the payment (client) email wins as primary
  let primary=keep.email;
  if(dup.client && !keep.client && dup.email){ primary=dup.email; }
  const altPick=[keep.email, dup.email, keep.alt, dup.alt].filter(e=>e && e!==primary)[0]||null;
  const jobs=[
    sb.from("touches").update({person_id:keepId}).eq("person_id",dup.id),
    sb.from("coupons").update({person_id:keepId}).eq("person_id",dup.id),
    sb.from("tickets").update({person_id:keepId}).eq("person_id",dup.id),
    sb.from("clients").update({person_id:keepId}).eq("person_id",dup.id)
  ];
  // phones: never lose one — main slot if free, otherwise the second slot
  if(!keep.phone && dup.phone) jobs.push(sb.from("people").update({phone:dup.phone, phone_norm:dup.phone.replace(/\D/g,"")}).eq("id",keepId));
  else if(keep.phone && dup.phone && keep.phone!==dup.phone && !keep.altPhone)
    jobs.push(sb.from("people").update({alt_phone:dup.phone, alt_phone_norm:dup.phone.replace(/\D/g,"")}).eq("id",keepId));
  const rs=await Promise.all(jobs);
  const bad=rs.find(r=>r.error);
  if(bad){ hubAlert("Merge failed", esc(bad.error.message)); return; }
  // free the duplicate's email first (unique index), then give the survivor both
  const r1=await sb.from("people").update({email:null, merged_into:keepId}).eq("id",dup.id);
  const r2=await sb.from("people").update({email:primary||null, alt_email:altPick}).eq("id",keepId);
  if(r1.error||r2.error){ hubAlert("Merge partially failed", esc((r1.error||r2.error).message)); return; }
  // Jira locations follow the surviving person too (they are server-written,
  // so the move goes through the guarded function)
  for(const j of RAW.jloc.filter(x=>x.person_id===dup.id)){
    const {error:le}=await sb.rpc("link_location",{loc_key:j.key, target:keepId});
    if(!le) j.person_id=keepId;
  }
  await logAudit("merge",{person_id:keepId,
    detail:(dup.name||"?")+" ("+(dup.email||dup.phone||"no contact")+") merged into "+(keep.name||"?"),
    undo:{dup_id:dup.id, dup_email:dup.email||null, keep_id:keepId,
          keep_email:keep.email||null, keep_alt:keep.alt||null}});
  toast("Merged ✓ (both emails and phones kept)");
  await loadData(); render();
};

window.undoMerge = async auditId => {

  if(r1.error){ hubAlert("Could not undo", esc(r1.error.message)); return; }
  const r2=await sb.from("people").update({email:u.keep_email||null, alt_email:u.keep_alt||null}).eq("id",u.keep_id);
  if(r2.error){ hubAlert("Partly undone", esc(r2.error.message)); }
  await logAudit("unmerge",{person_id:u.keep_id, detail:"merge reversed"});
  toast("Merge undone");

};

window.snooze = async (id,v) => {

  let dt=null;
  if(v==="custom"){
    const picked=await hubPrompt("⏰ Remind me about "+esc(l.name||"this lead"), {input:"date", okLabel:"Set reminder"});

  } else if(v!=="clear"){
    const d=new Date(TODAY); d.setDate(d.getDate()+ +v);
    // format in LOCAL time; toISOString would shift the date on non-UTC machines
    dt=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

  l.due=dt; derive(l); render(false);
  const card=document.querySelector(`.card[data-id="${id}"]`); if(card) card.classList.add("open");

/* styled dialogs: the hub never shows raw system popups. Pass pre-escaped strings. */
function hubDialog(o){
  return new Promise(res=>{
    const old=document.getElementById("hubdlg"); if(old) old.remove();
    const ov=document.createElement("div"); ov.id="hubdlg";
    ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:70";
    ov.innerHTML=`<div class="mcard">
      <h3>${o.title||""}</h3>
      ${o.body?`<div class="meta" style="white-space:pre-wrap;line-height:1.5">${o.body}</div>`:""}
      ${o.input?`<input class="li" id="dlg-in" type="${o.input}" placeholder="${esc(o.placeholder||"")}" value="${esc(o.value||"")}">`:""}
      <div class="acts" style="justify-content:flex-end">
        ${o.noCancel?"":`<button class="btn" id="dlg-no">${o.cancelLabel||"Cancel"}</button>`}
        <button class="btn primary" id="dlg-ok" ${o.danger?'style="background:var(--crit);border-color:var(--crit)"':""}>${o.okLabel||"OK"}</button>
      </div></div>`;
    const done=v=>{ ov.remove(); res(v); };
    ov.addEventListener("click",e=>{ if(e.target===ov) done(null); });
    ov.addEventListener("keydown",e=>{ if(e.key==="Escape") done(null); });
    ov.querySelector("#dlg-ok").onclick=()=>done(o.input?ov.querySelector("#dlg-in").value:true);
    const no=ov.querySelector("#dlg-no"); if(no) no.onclick=()=>done(null);
    document.body.appendChild(ov);
    const inp=ov.querySelector("#dlg-in");
    if(inp){ inp.focus(); inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); done(inp.value); } }); }
    else ov.querySelector("#dlg-ok").focus();
  });
}

const worked     = l => !l.isNew || l.attempted;
const newLeads   = () => LEADS.filter(l=>l.isNew && !l.attempted && !l.internal).sort((a,b)=>b.created-a.created);
const attemptedL = () => LEADS.filter(l=>l.attempted && ACTIVE(l.stage) && !l.internal)
                          .sort((a,b)=>(b.lastPast||b.created)-(a.lastPast||a.created));
const followups  = () => LEADS.filter(l=>worked(l) && ACTIVE(l.stage) && !l.internal)
                          .sort((a,b)=>(b.lastPast||b.created)-(a.lastPast||a.created));
const dueToday   = () => LEADS.filter(l=>!l.internal && ACTIVE(l.stage) && (
                          (l.planned && l.planned<=TODAY) ||
                          (worked(l) && l.quiet>=CAD().resurface && l.quiet<CAD().quiet && l.touches<5)));
const planned    = () => LEADS.filter(l=>l.planned && l.planned>TODAY && !l.internal && ACTIVE(l.stage)).sort((a,b)=>a.planned-b.planned);
const goneQuiet  = () => LEADS.filter(l=>worked(l) && ACTIVE(l.stage) && !l.internal && l.quiet>=CAD().quiet)
                          .sort((a,b)=>b.quiet-a.quiet);
const coupons    = () => LEADS.filter(l=>(l.coupons.length||l.coupon) && !l.internal && !l.client)
                          .sort((a,b)=>{
                            if(a.cp && b.cp) return a.cp.exp-b.cp.exp;
                            if(a.cp) return -1; if(b.cp) return 1;
                            return (b.created||0)-(a.created||0);
                          });
const couponsExpiring = () => LEADS.filter(l=>!l.internal && !l.client && ACTIVE(l.stage) && l.cp && daysTo(l.cp.exp)<=7)
                          .sort((a,b)=>a.cp.exp-b.cp.exp);
/* follow-up queue rules: a touch snoozes the lead for N days, then it resurfaces.
   The rhythm is per user (Settings → My cadence). */
function CAD(){ return Object.assign({resurface:3, quiet:14, callFrom:9, callTo:20, giveup:5},
  (window.__PREFS && window.__PREFS.cadence) || {}); }
const fuSnoozed   = l => l.lastPast && daysAgo(l.lastPast) < CAD().resurface;
const fuScheduled = l => l.planned && l.planned > TODAY;
/* his stop-chasing signals: dead number (call_na, never connected) or enough
   attempts without ever a real conversation. Any new touch or a real connect
   brings them back automatically. */
const neverConnected = l => !l.logs.some(g=>g.kind==="call" && (!g.detail || !/not reached/i.test(g.detail)));
const fuGaveUp    = l => !l.hot && !l.client && neverConnected(l) && (
     (l.sf==="call_na") ||
     (["New","Contacted"].includes(l.stage) && l.logs.filter(g=>g.kind==="call").length >= CAD().giveup));
const fuDue       = arr => arr.filter(l=>!fuSnoozed(l) && !fuScheduled(l) && !fuGaveUp(l));

function bars(pairs, colors, total){
  const max=Math.max(...pairs.map(p=>p[1]));
  return `<div class="bars">`+pairs.map((p,i)=>{
    const w=Math.max(2,Math.round(p[1]/max*100));
    const pc= total? ` · ${Math.round(p[1]/total*100)}%`:"";
    return `<div class="bar"><div class="lb">${esc(p[0])}</div>
      <div class="tr"><div class="fl" style="width:${w}%;background:${colors[i]||colors[colors.length-1]}"
        title="${esc(p[0])}: ${p[1]}"></div><span class="vl" style="--w:${w}%">${p[1]}${pc}</span></div></div>`;
  }).join("")+`</div>`;
}
function list(arr, extraFn){
  if(!arr.length) return `<div class="empty">Nothing here right now 🎉</div>`;
  return arr.map(l=>leadRow(l, extraFn&&extraFn(l))).join("");
}

function sortArr(arr){
  const s=window.SORT||"recent", a=[...arr];
  if(s==="newest") a.sort((x,y)=>(y.created||0)-(x.created||0));
  else if(s==="oldest") a.sort((x,y)=>(x.created||0)-(y.created||0));
  else if(s==="touches") a.sort((x,y)=>y.touches-x.touches);
  else if(s==="hot") a.sort((x,y)=>((y.hot?1:0)-(x.hot?1:0)) || ((y.lastPast||0)-(x.lastPast||0)));
  return a;
}

  funnel: {
    title:"Funnel", filterable:true, count:()=>applyView(LEADS.filter(l=>!l.internal)).length,
    render(){
      const arr=applyQ(LEADS.filter(l=>!l.internal));
      const set=activeCountries(), rb=rangeBounds();
      const mergedN=(window.__mergedRows||[]).filter(m=>set.has(m.cc) &&
        (!rb || (m.created && (!rb.from||m.created>=rb.from) && (!rb.to||m.created<=rb.to)))).length;
      const GIVEUP=CAD().giveup;
      const connectedCall=l=>l.logs.some(g=>g.kind==="call" && (!g.detail || !/not reached/i.test(g.detail)));
      const callN=l=>l.logs.filter(g=>g.kind==="call").length;
      // one bucket per human; a later real conversation rescues them back to Real
      const bucket=l=>{
        if(l.client) return "real";
        if(l.sf==="Duplicate") return "dup";
        if(l.stage==="Junk") return "junk";
        if(l.sf==="call_na" && !connectedCall(l)) return "wrong";
        if(["New","Contacted"].includes(l.stage) && callN(l)>=GIVEUP && !connectedCall(l) && !l.hot) return "gaveup";
        return "real";
      };
      const B={dup:mergedN, junk:0, wrong:0, gaveup:0};
      const realArr=[];
      arr.forEach(l=>{ const b=bucket(l); if(b==="real") realArr.push(l); else B[b]++; });
      const received=arr.length+mergedN;
      const notReal=B.dup+B.junk+B.wrong+B.gaveup;
      const realN=realArr.length;
      const pct=(n,d)=>d?Math.round(n/d*100):0;
      const untouched=realArr.filter(l=>l.isNew&&!l.attempted).length;
      const attempted=realArr.filter(l=>l.attempted).length;
      const cnt=s=>realArr.filter(l=>!l.isNew&&l.stage===s).length;
      const won=cnt("Won"), offers=cnt("Offer sent");
      const stages=[["New · untouched",untouched],["New · attempted",attempted],
        ["Contacted",cnt("Contacted")],["Qualified",cnt("Qualified")],["Offer sent",offers],
        ["Won",won],["Lost",cnt("Lost")]];
      const colors=["var(--f1)","var(--f1)","var(--f2)","var(--f3)","var(--f4)","var(--f5)","var(--fgray)"];
      const bs=[["Wrong number",B.wrong],["Duplicates",B.dup],["Junk / fake",B.junk],["Gave up · "+GIVEUP+"+ tries",B.gaveup]];
      const bucketSrc=s=>!s?"Other":/Discount/i.test(s)?"Discount request":/Book a Call/i.test(s)?"Book a call"
        :/Checkout/i.test(s)?"Checkout":/Calendly/i.test(s)?"Calendly":s==="Website"?"Website":"Other";
      const sc={}; arr.forEach(l=>{const k=bucketSrc(l.src); sc[k]=(sc[k]||0)+1;});
      const src=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
      return `
      <div class="tiles">
        <div class="tile"><div class="v">${received}</div><div class="l">Received</div><div class="s">everything that came in, incl. duplicates and junk</div></div>
        <div class="tile"><div class="v">${notReal}</div><div class="l">Not real</div><div class="s">${pct(notReal,received)}% of received · breakdown below</div></div>
        <div class="tile"><div class="v">${realN}</div><div class="l">Real leads</div><div class="s">${pct(realN,received)}% of received · worth working</div></div>
        <div class="tile click" onclick="go('followups')"><div class="v">${offers}</div><div class="l">Offers out</div></div>
        <div class="tile"><div class="v">${won}</div><div class="l">Won</div><div class="s">${pct(won,realN)}% of real leads</div></div>
      </div>
      <details class="tbl"><summary>Not real: ${notReal} (${pct(notReal,received)}% of received) · wrong numbers, duplicates, junk, given up</summary>
      <p class="hint">Wrong number = status call_na and never a connected call (calling no longer applicable). Gave up = ${GIVEUP}+ call attempts, none connected (threshold: Settings → My cadence). Duplicates = merged cards + Salesforce-flagged. Anyone you later actually reach moves back to Real automatically.</p>
      ${bars(bs,["var(--serious)","var(--fgray)","var(--fgray)","var(--warn)"],received)}</details>
      <h2>Pipeline, real leads only (${realN})</h2>
      <p class="hint">Counts follow the filter bar (countries + date range). Percentages are of REAL leads, so conversion is honest: dead numbers and junk no longer water it down. Nothing is changed in Salesforce.</p>
      ${bars(stages,colors,realN||1)}
      <h2>Leads by source (all received)</h2>
      ${bars(src,["var(--f3)","var(--f3)","var(--f3)","var(--f3)","var(--f3)","var(--f3)"],received)}
      <details class="tbl"><summary>View as table</summary><table>
      <tr><th>Intake</th><th>Leads</th></tr>
      <tr><td>Received</td><td>${received}</td></tr>
      ${bs.map(s=>`<tr><td>· ${esc(s[0])}</td><td>${s[1]}</td></tr>`).join("")}
      <tr><td><b>Real</b></td><td><b>${realN}</b></td></tr>
      <tr><th>Stage (of real)</th><th>Leads</th></tr>
      ${stages.map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td></tr>`).join("")}
      <tr><th>Source</th><th>Leads</th></tr>
      ${src.map(s=>`<tr><td>${esc(s[0])}</td><td>${s[1]}</td></tr>`).join("")}</table></details>`;
    }
  },
  clients: {
    title:"Clients", filterable:true, count:()=>(window.__clients||[]).length,
    render(){
      const q=(document.getElementById("q").value||"").toLowerCase().trim();
      const set=activeCountries();
      const ccOf=cl=>{ const lead=cl.person_id&&byId[cl.person_id];
        if(lead) return lead.cc;

      const rbC = rangeBounds();
      const cs=(window.__clients||[]).filter(cl=>
        (!q||[cl.name,cl.email].some(v=>(v||"").toLowerCase().includes(q)))
        && set.has(ccOf(cl))
        && (!rbC || (cl.first_paid_at && (!rbC.from || new Date(cl.first_paid_at)>=rbC.from)
                                      && (!rbC.to || new Date(cl.first_paid_at)<=rbC.to))));
      const soC=(window.__SORTX||{}).clients||"total";
      cs.sort(soC==="mrr"?(a,b)=>(b.mrr||0)-(a.mrr||0)

      const monthsActive=Math.max(1,firsts.length?Math.round((Date.now()-Math.min(...firsts))/2592000000):1);
      const monthly=totalRev/monthsActive;
      return `
      <p class="hint">Everyone who actually paid, straight from Stripe. Country and date filters above apply (date = first payment, so ranges show new-client cohorts for reporting). Projection = monthly run-rate × 12 ("Subscriptions: Read" on the Stripe key would unlock true MRR). Clients are automatically counted as "Won" in the funnel and removed from all chase lists, so lead history stays accurate: a converted lead is still a lead in the year's numbers, just not a target anymore.</p>
      <div class="tiles">
        <div class="tile"><div class="v">${cs.length}</div><div class="l">Paying clients</div></div>
        <div class="tile"><div class="v">${eur(totalRev)}</div><div class="l">Collected, all time</div></div>

        <div class="tile"><div class="v">${eur(monthly)}</div><div class="l">Monthly run-rate</div></div>
        <div class="tile"><div class="v">${eur(monthly*12)}</div><div class="l">Projected 12 months</div></div>
      </div>
      <div class="filters">${sortSelX("clients",[["total","Sort: total paid"],["mrr","Sort: MRR"],["last","Sort: last payment"]],"total")}</div>
      ${cs.map(cl=>{
        const lead = (cl.person_id&&byId[cl.person_id]) || null;
        const last = cl.last_paid_at? daysAgo(new Date(String(cl.last_paid_at).slice(0,10)+"T00:00:00")) : null;
        const pays = (cl.raw && cl.raw.pays) || [];
        const isOpen = (window.__openC||new Set()).has(cl.stripe_id);
        return `<div class="card ${isOpen?'open':''}"><div class="row" onclick="toggleC('${esc(cl.stripe_id)}')">
          <div class="who"><span class="nm">💰 ${esc(cl.name||cl.email||cl.stripe_id)}</span>
            <div class="co">${esc(cl.email||"")}</div></div>
          <span class="chip" title="Successful Stripe payments only">${cl.payments}× paid ✓</span>
          ${lead?`<span class="chip stage">${esc(lead.hub||lead.stage)}</span>`:""}
          <a class="btn" href="https://dashboard.stripe.com/customers/${esc(cl.stripe_id)}" target="_blank" title="Open in Stripe" onclick="event.stopPropagation()">Stripe ↗</a>
          ${cl.email?`<button class="btn" onclick="copyTxt('${esc(cl.email)}','email');event.stopPropagation()" title="Copy email">📋 ✉</button>`:""}
          <span class="badge-t">${eur(cl.total_paid,cl.currency)}</span>
          <span class="meta">${last===null?"":(last===0?"paid today":"paid "+last+"d ago")}</span>
        </div>
        <div class="detail" style="display:${isOpen?'flex':'none'};flex-direction:column">
          <div class="notelog">${pays.length?pays.map(p2=>`<div class="noteitem">
            <span class="meta">${new Date(p2.t*1000).toLocaleDateString()}</span> ${eur(p2.amt,cl.currency)}
            ${p2.inv?` · invoice ${esc(String(p2.inv).slice(-10))}`:""}
            · <a href="https://dashboard.stripe.com/payments/${esc(p2.id)}" target="_blank">receipt ↗</a></div>`).join("")
            :'<div class="meta">Payment details appear after the next Stripe sync (runs within 30 min).</div>'}</div>
        </div></div>`;
      }).join("")||'<div class="empty">No paying clients found</div>'}`;
    }
  },

            ${esc(m.snippet||"(no text preview)")}</div>`).join("");
        return `<div class="card ${isOpen?'open':''}"><div class="row" onclick="toggleT(${t.id})">
          <div class="who"><span class="nm">${esc(t.customer_name||t.customer_email||"?")}</span>
            <div class="co">${esc(t.subject||"")}</div></div>
          <span class="chip" style="cursor:${window.CANW!==false?'pointer':'default'}" title="Detected from the first message body. Wrong? Click to flip DE/EN." onclick="${window.CANW!==false?`langFlip(${t.id});event.stopPropagation()`:''}">${t.language==="de"?"🇩🇪 DE":"🇬🇧 EN"}</span>
          ${msgs.length?`<span class="badge-t">${msgs.length}✉</span>`:""}
          ${lead?`<span class="chip stage" title="Also a sales lead">lead ✦</span>`:""}
          ${lead&&locsFor(lead).some(j=>((window.__kidsByParent||{})[j.key]||[]).some(k=>k.project==="RK"&&kidOpen(k)))?`<span class="chip jump" onclick="go('ops');window.__OPS={kind:'service'};event.stopPropagation()" title="This customer also has an open service ticket in Jira">🔧 Jira service →</span>`:""}
          ${(t.assignees||[]).length?`<span class="chip asg" title="Assigned to ${esc((t.assignees||[]).join(", "))}">👤 ${(t.assignees||[]).map(a=>esc(String(a).split("@")[0])).join(" + ")}</span>`:""}
          ${window.CANW!==false?`<select class="st" onchange="assignT(${t.id},this.value);this.selectedIndex=0" onclick="event.stopPropagation()" title="Assign or unassign (picking an assigned person removes them)">
            <option value="">👤 Assign…</option>
            <option value="__me">→ me</option>
            ${(window.__users||[]).filter(u=>u.email!==ME).map(u=>`<option value="${esc(u.email)}">${esc(u.name||u.email.split("@")[0])}${(t.assignees||[]).includes(u.email)?" ✓":""}</option>`).join("")}
            ${(t.assignees||[]).length?`<option value="__clear">✗ Clear all</option>`:""}
          </select>`:""}
          <select class="st" ${window.CANW===false?"disabled":""} onchange="setTicketState(${t.id},this.value)" onclick="event.stopPropagation()">
            ${Object.entries(NAMES).map(([s,n])=>`<option value="${s}" ${t.state===s?"selected":""}>${n}</option>`).join("")}
          </select>
          <button class="btn" onclick="copyTxt('${esc(t.customer_email||"")}','email');event.stopPropagation()" title="Copy email for your webmail reply">📋 ✉</button>
          ${phone?`<button class="btn" onclick="copyTxt('${esc(phone)}','phone number');event.stopPropagation()" title="Copy phone for Placetel">📋 ☎</button>`
                 :`<span class="chip" style="opacity:.55" title="No phone on file for this customer yet. Attach a number via ⇄ Merge or the Unmatched tray and the copy button appears here.">☎ none</span>`}
          <span class="meta ${stale?'quiet':''}">${last===0?"active today":last+"d silent"} · opened ${age}d ago</span>
        </div>
        <div class="detail" style="display:${isOpen?'flex':'none'};flex-direction:column">
          <div class="notelog" style="max-height:320px">${thread||'<div class="meta">No message content stored for this thread yet (older thread; new mails will appear here automatically).</div>'}</div>
          <div class="acts" style="margin-top:8px">
            <button class="btn" onclick="remT(${t.id});event.stopPropagation()" title="A personal reminder under the 🔔 bell, e.g. 'promised an answer by Friday'">⏰ Remind me</button>
            ${window.CANW!==false?`<select class="st" onchange="ticketReclass(${t.id},this.value);this.selectedIndex=0" onclick="event.stopPropagation()" title="Wrongly sorted into Support? Move it out.">

              <option value="lead">→ Sales lead (partnership, enquiry)</option>
              <option value="junk">🗑 Junk, delete thread</option>
            </select>`:""}
          </div>
        </div></div>`;
      };
      const junked=ts.filter(t=>t.junked).sort(byAct);
      const jrow=t=>`<div class="card"><div class="row" style="cursor:default">

        <button class="fbtn ${S.un?'active':''}" onclick="supUn()" title="Only tickets nobody has picked up yet">Unassigned</button>

        ${sortSelX("support",[["recent","Sort: recent activity"],["silent","Sort: longest silent first"]],"recent")}
        <span style="flex:1"></span>${sf("days","all","All time")}${sf("days",30,"Opened ≤30d")}${sf("days",7,"Opened ≤7d")}</div>
      <h2>Waiting on us (${open.length})</h2>${open.map(row).join("")||'<div class="empty">Inbox zero 🎉</div>'}
      <h2>Waiting on customer (${wait.length})</h2>${wait.map(row).join("")||'<div class="empty">Nothing pending</div>'}
      <h2>Recently resolved</h2>${res.map(row).join("")||'<div class="empty">None yet</div>'}
      <details class="tbl" ${junked.length?"":"style='display:none'"}><summary>🗑 Junked (${junked.length}): hidden threads, restore or delete forever</summary>
      ${junked.map(jrow).join("")||'<div class="meta" style="padding:8px">Nothing junked</div>'}</details>`;
    }
  },

  trays: {

        </div></div>`).join("")}`; })()}
      <details class="tbl"><summary>Dismissed (${dC.length+dM.length}): kept here forever, restore any time</summary>
      ${[...dC.map(callRow),...dM.map(mailRow)].join("")||'<div class="meta" style="padding:8px">Nothing dismissed yet</div>'}</details>`;
    }
  }
};
window.setPF = f => { window.__PF=f; render(false); };

/* every section headline folds on click; what you fold stays folded on this device */
function applyFolds(){
  const key="hub_folds_"+CURRENT;
  let folds={}; try{ folds=JSON.parse(localStorage.getItem(key)||"{}"); }catch(e){}
  document.querySelectorAll("#content h2").forEach(h=>{
    const id=h.textContent.replace(/[\d(),·]+/g,"").trim();
    const folded=!!folds[id];
    h.classList.add("foldable"); h.classList.toggle("folded",folded);
    h.title="Click to "+(folded?"unfold":"fold")+" this section";
    let el=h.nextElementSibling;
    while(el && el.tagName!=="H2"){ el.style.display=folded?"none":""; el=el.nextElementSibling; }
    h.onclick=()=>{
      folds[id]=!folds[id];
      localStorage.setItem(key,JSON.stringify(folds));
      render(false);
    };
  });
}

/* ---------- global search: one box finds people, clients and tickets everywhere ---------- */
function renderQDrop(){
  const box=document.getElementById("qdrop"); if(!box) return;
  const q=(document.getElementById("q").value||"").toLowerCase().trim();
  if(q.length<2){ box.style.display="none"; box.innerHTML=""; return; }
  const hits=[];
  try{
    for(const l of LEADS){
      if(hits.length>=12) break;
      if(matchLead(l,q)){
        const life=lifecycleOf(l);
        hits.push({tag:l.internal?"colleague":life==="client"?"client":life==="support"?"person":"lead",
          h:`<b>${esc(l.name||l.email)}</b> <span class="meta">${esc(l.co||l.email||l.phone||"")}</span>`,
          act:"openPerson('"+l.id+"')"});
      }
    }
    for(const t of (window.__tickets||[])){
      if(hits.length>=17) break;
      if([t.subject,t.customer_name,t.customer_email].some(v=>(v||"").toLowerCase().includes(q)))
        hits.push({tag:"ticket", h:`<b>${esc(t.customer_name||t.customer_email||"?")}</b> <span class="meta">${esc((t.subject||"").slice(0,60))}</span>`,
          act:"openTicket("+t.id+")"});
    }
    for(const cl of (window.__clients||[])){
      if(hits.length>=20) break;
      if(cl.person_id && byId[cl.person_id]) continue;
      if([cl.name,cl.email].some(v=>(v||"").toLowerCase().includes(q)))
        hits.push({tag:"client", h:`<b>${esc(cl.name||cl.email)}</b> <span class="meta">${esc(eur(cl.total_paid,cl.currency))}</span>`,
          act:"jumpSearch('clients','"+esc((cl.email||cl.name||"").replace(/'/g,""))+"')"});
    }
  }catch(e){ console.error("search failed:",e); }
  box.innerHTML=hits.map(x=>`<div class="qhit" onclick="${x.act};qClose()"><span class="tag">${x.tag}</span><div style="flex:1">${x.h}</div></div>`).join("")
    || '<div class="qhit"><span class="meta">No match anywhere in the hub</span></div>';
  box.style.display="block";
}

window.viewAction = async v => {
  if(!v) return;
  const P = window.__PREFS = (window.__PREFS||{}); P.views = P.views||{};
  if(v==="__save"){
    const name = await hubPrompt("💾 Save current view", {placeholder:"Name, e.g. DACH support or US hot leads", okLabel:"Save view"});
    if(!name || !String(name).trim()) return;
    const nm = String(name).trim().slice(0,40);
    P.views[nm] = viewSnap();
    window.__curView = nm;
    if(await savePrefs()) toast("View saved: "+nm);
    render(false);

    if(!window.__curView) return;
    P.views[window.__curView] = viewSnap();
    if(await savePrefs()) toast('View "'+window.__curView+'" updated with the current filters');
    render(false);
  } else if(v==="__ren"){
    if(!window.__curView) return;
    const name = await hubPrompt('✏️ Rename view "'+esc(window.__curView)+'"', {value:window.__curView, okLabel:"Rename"});
    if(!name || !String(name).trim()) return;
    const nm = String(name).trim().slice(0,40);
    if(nm!==window.__curView){
      if(P.views[nm] && !await hubConfirm('A view called "'+esc(nm)+'" already exists.','Replace it with this one?','Replace')) return;
      P.views[nm]=P.views[window.__curView];
      delete P.views[window.__curView];
      window.__curView=nm;
      if(await savePrefs()) toast("View renamed to "+nm);
    }
    render(false);
  } else if(v==="__del"){
    if(!window.__curView) return;
    if(!await hubConfirm("🗑 Delete view \""+esc(window.__curView)+"\"?","Only the saved shortcut disappears, no data is affected.","Delete")) return;
    delete P.views[window.__curView]; window.__curView=null;

    if(s.view){ VIEW=Object.assign({},VIEW,s.view); saveView(); }

};

/* Likely duplicates, suggested only: same phone digits, same email, or the same
   name at the same company. Nothing is ever merged automatically; the hub just
   stops you from having to notice by chance. */
function duplicateSuggestions(){
  const out=[], seenPair=new Set();
  const add=(a,b,why)=>{
    if(a.id===b.id) return;
    const k=[a.id,b.id].sort().join("|");
    if(seenPair.has(k)) return;
    seenPair.add(k); out.push({a,b,why});
  };
  const byPhone={}, byMail={}, byName={};
  LEADS.filter(l=>!l.internal).forEach(l=>{
    [l.phone,l.altPhone].filter(Boolean).forEach(p=>{
      const d=digits(p).slice(-9); if(d.length<9) return;
      (byPhone[d]=byPhone[d]||[]).push(l);
    });
    [l.email,l.alt].filter(Boolean).forEach(e=>{
      const m=e.toLowerCase().trim(); (byMail[m]=byMail[m]||[]).push(l);
    });
    const nm=(l.name||"").toLowerCase().replace(/[^a-z]/g,"");
    const co=(l.co||"").toLowerCase().replace(/[^a-z]/g,"");
    if(nm.length>3 && co.length>3) (byName[nm+"@"+co]=byName[nm+"@"+co]||[]).push(l);
  });
  Object.values(byPhone).forEach(g=>{ for(let i=1;i<g.length;i++) add(g[0],g[i],"same phone number"); });
  Object.values(byMail).forEach(g=>{ for(let i=1;i<g.length;i++) add(g[0],g[i],"same email address"); });
  Object.values(byName).forEach(g=>{ for(let i=1;i<g.length;i++) add(g[0],g[i],"same name at the same company"); });
  return out.sort((x,y)=>(y.a.touches+y.b.touches)-(x.a.touches+x.b.touches));
}
